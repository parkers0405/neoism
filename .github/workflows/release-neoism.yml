name: Release Neoism
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing nightly tag to update (blank uses the selected tag)
        type: string
      source_ref:
        description: Exact source commit to build (nightly dispatcher pins this)
        type: string
      validate_only:
        description: Run release-mode app tests without creating or publishing a release
        type: boolean
        default: false
      platform:
        description: Build all platforms, or retry one platform after a fix
        type: choice
        default: all
        options: [all, linux, macos, windows]
permissions:
  contents: write
jobs:
  dispatch-nightly:
    if: github.event_name == 'push' && contains(github.ref_name, '-nightly.')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    concurrency:
      group: nightly-cache-dispatch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build nightlies on one reusable cache scope
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/dispatch-nightly-release.py
  prepare:
    if: github.event_name != 'push' || !contains(github.ref_name, '-nightly.')
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      matrix: ${{ steps.release.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          submodules: recursive
      - name: Prepare shared release and independent platform jobs
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
          REQUESTED_PLATFORM: ${{ inputs.platform || 'all' }}
          VALIDATE_ONLY: ${{ inputs.validate_only || false }}
        run: |
          tag="${REQUESTED_TAG:-$GITHUB_REF_NAME}"
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          [[ "$tag" == "v$version" ]] || { echo 'Release tag must match the checkout version'; exit 1; }
          # Stable artifacts must all come from their tag. A nightly platform
          # retry may build a fix from this branch; each asset records its SHA.
          # Validation may check an untagged candidate, but cannot publish assets.
          if [[ "$VALIDATE_ONLY" != true && "$tag" != *-nightly.* ]]; then
            [[ "$GITHUB_REF" == "refs/tags/$tag" ]] || exit 1
            [[ "$GITHUB_SHA" == "$(git rev-parse HEAD)" ]] || exit 1
          fi
          if [[ "$VALIDATE_ONLY" != true ]]; then
            flags=()
            if [[ "$tag" == *-* ]]; then flags+=(--prerelease --latest=false); else flags+=(--prerelease=false --latest); fi
            gh release view "$tag" || gh release create "$tag" --verify-tag --draft --generate-notes "${flags[@]}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          entries = [
              {'platform': 'linux', 'runner': 'ubuntu-24.04', 'asset': 'linux-x86_64'},
              {'platform': 'macos', 'runner': 'macos-15', 'asset': 'darwin-aarch64'},
              {'platform': 'windows', 'runner': 'windows-2025', 'asset': 'windows-x86_64'},
          ]
          chosen = os.environ['REQUESTED_PLATFORM']
          print('matrix=' + json.dumps({'include': [e for e in entries if chosen == 'all' or chosen == e['platform']]}))
          PY
  build:
    name: ${{ matrix.platform }} bundle
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    concurrency:
      group: ${{ inputs.validate_only && 'validate' || 'nightly' }}-${{ needs.prepare.outputs.tag }}-${{ matrix.platform }}
      # An explicit single-platform retry supersedes that platform's obsolete
      # attempt without interrupting the other jobs in its original run.
      cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && inputs.platform == matrix.platform }}
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_RELEASE_DEBUG: 0
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
    steps:
      # Configure Git before checkout: changing this afterward leaves CRLF
      # conversions in the patch and generated files already on disk.
      - name: Preserve source bytes and support long Windows paths
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libfontconfig1-dev libfreetype-dev libgbm-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev libwayland-dev libasound2-dev libvulkan-dev mesa-vulkan-drivers
      # The app is its own workspace on the toolchain Rune pins (rune/app/rust-toolchain.toml).
      - name: Install the app's Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          # The dedicated service/app caches below already retain targets.
          # Duplicating them here evicts other platforms from the shared quota.
          cache-targets: false
          workspaces: |
            . -> target
            rune/app -> target
          shared-key: neoism-release-${{ matrix.asset }}
          cache-on-failure: true
      - uses: actions/cache/restore@v4
        if: ${{ !inputs.validate_only }}
        id: service-cache
        with:
          path: target/release
          key: gpuix-services-${{ matrix.asset }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: gpuix-services-${{ matrix.asset }}-
      - uses: actions/cache/restore@v4
        id: app-cache
        with:
          path: rune/app/target
          # A fresh key retains compilation completed since the previous retry.
          key: rune-app-${{ matrix.asset }}-${{ hashFiles('rune/app/Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            rune-app-${{ matrix.asset }}-${{ hashFiles('rune/app/Cargo.lock') }}-
            rune-app-${{ matrix.asset }}-
      - uses: actions/cache/restore@v4
        id: zig-cache
        with:
          path: |
            neoism-frontend/gpuix/artifacts/zig-*.tar.xz
            neoism-frontend/gpuix/artifacts/zig-*.zip
          key: zig-archives-${{ matrix.asset }}-${{ hashFiles('neoism-frontend/gpuix/native/ghostty-pin.json') }}
      - name: Reuse unchanged source from restored compilation
        env:
          SERVICE_CACHE_KEY: ${{ steps.service-cache.outputs.cache-matched-key }}
        run: python scripts/restore-cached-source-times.py
      - name: Report actual compilation cache reuse
        shell: bash
        env:
          APP_CACHE: ${{ steps.app-cache.outputs.cache-matched-key }}
          SERVICE_CACHE: ${{ steps.service-cache.outputs.cache-matched-key }}
        run: |
          printf 'Cache scope: %s\nApp cache: %s\nService cache: %s\n' "$GITHUB_REF" "${APP_CACHE:-MISS (cold build)}" "${SERVICE_CACHE:-MISS (cold build)}" | tee -a "$GITHUB_STEP_SUMMARY"
      # Without the certificate secret the macOS bundle stays ad-hoc signed.
      - name: Load the Developer ID certificate and notarization credentials
        if: runner.os == 'macOS' && !inputs.validate_only
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE" ]; then
            echo 'No Developer ID certificate configured: this build is ad-hoc signed.' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          keychain="$RUNNER_TEMP/neoism-signing.keychain-db"
          password="$(openssl rand -hex 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          [ -n "$identity" ] || { echo 'The certificate is not a Developer ID Application identity.'; exit 1; }
          echo "NEOISM_CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          if [ -n "$APPLE_APP_PASSWORD" ]; then
            xcrun notarytool store-credentials neoism-notary --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --keychain "$keychain"
            echo 'NEOISM_NOTARY_PROFILE=neoism-notary' >> "$GITHUB_ENV"
            echo "NEOISM_NOTARY_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          fi
      - name: Build, test, and package the app and services
        id: bundle
        run: python scripts/build-rune-release.py ${{ inputs.validate_only && '--test-app-only' || '' }}
      - name: Build and validate Windows MSI and updater transactions
        if: runner.os == 'Windows' && !inputs.validate_only
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed' }
          wix extension add --global WixToolset.UI.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { throw 'WiX UI installation failed' }
          ./scripts/build-gpuix-msi.ps1
      - name: Retain Windows installer diagnostics
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-diagnostics
          path: windows-validation/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.validate_only }}
        with:
          name: neoism-${{ matrix.asset }}
          path: |
            release/neoism-${{ matrix.asset }}.*
            release/Neoism-x86_64.msi
            release/Neoism-x86_64.msi.sha256
          if-no-files-found: error
      # Each job publishes immediately. There is deliberately no all-platform
      # success barrier, and GitHub's rerun-failed-jobs retains successful legs.
      - name: Publish this platform as soon as it is ready
        if: ${{ !inputs.validate_only }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          ASSET: ${{ matrix.asset }}
        run: |
          assets=(release/neoism-"$ASSET".*)
          if [[ "$ASSET" == windows-* ]]; then assets+=(release/Neoism-x86_64.msi release/Neoism-x86_64.msi.sha256); fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease --latest=false); else flags+=(--prerelease=false --latest); fi
          gh release edit "$RELEASE_TAG" --draft=false "${flags[@]}"
      - name: Record source freshness for complete and partial compilation
        if: always()
        env:
          SERVICE_CACHE_SAVE_KEY: ${{ steps.service-cache.outputs.cache-primary-key }}
        run: python scripts/restore-cached-source-times.py --save
      - name: Save app compilation progress even if later checks fail
        if: always() && steps.app-cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@v4
        with:
          path: rune/app/target
          key: ${{ steps.app-cache.outputs.cache-primary-key }}
      - name: Save service compilation progress
        if: always() && steps.service-cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@v4
        with:
          path: target/release
          key: ${{ steps.service-cache.outputs.cache-primary-key }}
      - name: Save verified Zig archives
        if: always() && steps.zig-cache.outputs.cache-primary-key != '' && steps.zig-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            neoism-frontend/gpuix/artifacts/zig-*.tar.xz
            neoism-frontend/gpuix/artifacts/zig-*.zip
          key: ${{ steps.zig-cache.outputs.cache-primary-key }}
