[package]
name = "neoism-workspace-daemon"
version.workspace = true
edition = "2021"
license = "MIT"
description = "Neoism workspace daemon hosting the wire protocol"

[[bin]]
name = "neoism-workspace-daemon"
path = "src/main.rs"

[dependencies]
neoism-protocol = { workspace = true }
neoism-ui = { workspace = true }
neoism-backend = { workspace = true }
neoism-agent-server = { workspace = true }
neoism-workspace-index = { workspace = true }
neoism-terminal-pty = { workspace = true }
parking_lot = { workspace = true }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower = "0.5"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = "1"
url = { workspace = true }
uuid = { workspace = true }
dashmap = { workspace = true }
notify = "8.2.0"
thiserror = "1"
futures = { workspace = true }
libc = { workspace = true }
git2 = { version = "0.20", default-features = false }
walkdir = "2"
rand = "0.8"
sha2 = "0.10"
subtle = "2.5"
time = { version = "0.3", features = ["serde", "formatting"] }
dirs = "5"
gethostname = "1.1"
reqwest = { workspace = true }
clap = { workspace = true }
# Unix-socket serving in the binary (same hyper-util accept loop the
# desktop's embedded daemon uses) so a plain `neoism` launch attaches
# to this daemon instead of spawning its own embedded one.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "tokio", "http1", "service"] }

# Owner+SYSTEM-only DACLs on secret files — the Windows counterpart of the
# unix 0o600/0o700 tightening (see src/windows_acl.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
tokio-tungstenite = "0.24"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"
