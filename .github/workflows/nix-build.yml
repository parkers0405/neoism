name: Nix Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.nix'
      - 'flake.lock'
      - 'rust-toolchain.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      # Workspace members, including their embedded assets and build scripts.
      - 'neoism-*/**'
      - 'teletypewriter/**'
      - 'corcovado/**'
      - 'assets/omarchy/**'
      - 'README.md'
      - 'scripts/blaze.sh'
      - 'scripts/test-workspace.mjs'
      - 'scripts/prepare-blaze-runner.sh'
      - '.cargo/**'
      - 'vendor/blaze-compat/**'
      - 'misc/**'
      - '.github/workflows/nix-build.yml'

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Provision compiler memory
        run: bash scripts/prepare-blaze-runner.sh
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: DeterminateSystems/flake-checker-action@main
      - name: Evaluate all declared platforms
        run: nix flake check --all-systems --no-build --no-write-lock-file
      - name: Check runtime library loading
        run: nix flake check --no-write-lock-file --max-jobs 1 --cores 2 --print-build-logs
      - name: Build native package
        # The published Blaze compiler refuses the unmapped owner of Nix's
        # sandbox root. This derivation opts out; dependencies remain pinned.
        run: sudo nix build .#neoism-services --option sandbox relaxed --no-write-lock-file --max-jobs 1 --cores 2 --print-build-logs
