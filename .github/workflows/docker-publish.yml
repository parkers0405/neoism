name: Publish daemon image

# Publishes the self-host daemon image to GHCR so `docker compose
# --profile server` (and plain `docker run`) users pull a prebuilt
# image instead of compiling the workspace from source. Runs on
# release tags and by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing nightly tag to rebuild from the selected branch
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate an explicit nightly rebuild
        id: release
        if: inputs.release_tag != ''
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          [[ "$REQUESTED_TAG" == "v$version" && "$REQUESTED_TAG" == *-nightly.* ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$REQUESTED_TAG" >/dev/null
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Provision compiler memory
        run: bash scripts/prepare-blaze-runner.sh

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/neoism-daemon
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=raw,value=${{ steps.release.outputs.version }},enable=${{ inputs.release_tag != '' }}
            type=raw,value=nightly,enable=${{ contains(github.ref_name, '-nightly.') || inputs.release_tag != '' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Docker uses the same pinned Blaze release as local and CI builds.
          cache-from: type=gha
          cache-to: type=gha,mode=max
