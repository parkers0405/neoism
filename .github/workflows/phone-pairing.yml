name: Desktop phone pairing
on:
  pull_request:
    paths:
      - 'neoism-workspace-daemon/src/server/mobile_device.rs'
      - 'neoism-workspace-daemon/src/server/mobile_device/**'
      - 'neoism-workspace-daemon/src/windows_acl.rs'
      - 'neoism-workspace-daemon/Cargo.toml'
      - '.github/workflows/phone-pairing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pairing:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.92'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake pkg-config libfontconfig1-dev libgbm-dev libxkbcommon-dev libssl-dev
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - run: cargo test --locked -p neoism-workspace-daemon --lib server::mobile_device