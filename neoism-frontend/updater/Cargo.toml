[package]
name = "neoism-update-helper"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
dirs = "6.0.0"
reqwest.workspace = true
tokio.workspace = true
futures.workspace = true
libc.workspace = true
semver = "1"

[[bin]]
name = "neoism-update-helper"
path = "src/main.rs"

# Old released installers require this companion's presence and version. The
# Lua runtime was retired; retain its filename as an explicit update bridge.
[[bin]]
name = "neoism-agent-lua-runner"
path = "src/main.rs"
