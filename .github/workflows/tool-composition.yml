name: Tool Composition

on:
  pull_request:
    paths:
      - "neoism-agent/crates/neoism-agent-composition/**"
      - "neoism-agent/crates/neoism-agent-server/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - ".github/workflows/tool-composition.yml"
      - ".github/actions/setup-blaze/**"
      - "scripts/*blaze*"
      - "neoism-frontend/gpuix/native/blaze-pin.json"
  push:
    branches: [main]
    paths:
      - "neoism-agent/crates/neoism-agent-composition/**"
      - "neoism-agent/crates/neoism-agent-server/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - ".github/workflows/tool-composition.yml"
      - ".github/actions/setup-blaze/**"
      - "scripts/*blaze*"
      - "neoism-frontend/gpuix/native/blaze-pin.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tool-composition-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: Rust interpreter (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: ./.github/actions/setup-blaze
      - name: Check the built-in runtime
        run: bash scripts/blaze.sh check --locked -p neoism-agent-composition --all-targets
      - name: Test confinement, limits, and tool composition
        run: bash scripts/blaze.sh test --locked -p neoism-agent-composition
