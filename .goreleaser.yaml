version: 2

# TODO(neoism): This GoReleaser config is inherited from Rio and is currently
# DISABLED (see .github/workflows/release.yml — the live release path is
# release-neoism.yml). It still references Rio's cargo package names
# (rioterm, rio-window, rio-backend, ...) and rio.desktop, which
# no longer exist in this workspace. Rio/personal identity has been stripped;
# a full neoism packaging retarget is still needed before re-enabling this.

partial:
  by: goos

report_sizes: true

env:
  - RUSTFLAGS=-C link-arg=-s
  - CARGO_TERM_COLOR=always
  - RUST_BACKTRACE=full

before:
  hooks:
    - if: '{{ eq .Runtime.Goos "windows" }}'
      cmd: dotnet tool install --global wix --version 5.0.2
      output: true
    - if: '{{ eq .Runtime.Goos "windows" }}'
      cmd: wix extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2
      output: true

builds:
  - id: windows-x86_64
    builder: rust
    command: build
    flags: [--release, -p=rioterm]
    targets: [x86_64-pc-windows-msvc]

  - id: windows-arm64
    builder: rust
    command: build
    flags: [--release, -p=rioterm]
    targets: [aarch64-pc-windows-msvc]

  - id: macos
    builder: rust
    command: build
    flags: [--release, -p=rioterm]
    env:
      - MACOSX_DEPLOYMENT_TARGET={{ if eq .Arch "amd64" }}10.15{{ else }}11.0{{ end }}
      - CARGO_PROFILE_RELEASE_OPT_LEVEL=s
    targets: [x86_64-apple-darwin, aarch64-apple-darwin]

  - id: linux-arm64-wayland
    builder: rust
    command: build
    flags: [--release, -p=rioterm, --no-default-features, --features=wayland]
    env:
      - CARGO_PROFILE_RELEASE_OPT_LEVEL=s
    targets: [aarch64-unknown-linux-gnu]

  - id: linux-arm64-x11
    builder: rust
    command: build
    flags: [--release, -p=rioterm, --no-default-features, --features=x11]
    env:
      - CARGO_PROFILE_RELEASE_OPT_LEVEL=s
    targets: [aarch64-unknown-linux-gnu]

  - id: linux-x64-wayland
    builder: rust
    command: build
    flags: [--release, -p=rioterm, --no-default-features, --features=wayland]
    env:
      - CARGO_PROFILE_RELEASE_OPT_LEVEL=s
    targets: [x86_64-unknown-linux-gnu]

  - id: linux-x64-x11
    builder: rust
    command: build
    flags: [--release, -p=rioterm, --no-default-features, --features=x11]
    env:
      - CARGO_PROFILE_RELEASE_OPT_LEVEL=s
    targets: [x86_64-unknown-linux-gnu]

release:
  make_latest: "{{ if .IsNightly }}false{{ else }}true{{ end }}"
  mode: append
  prerelease: auto
  use_existing_draft: false
  replace_existing_draft: false
  replace_existing_artifacts: true
  include_meta: false
  header: |
    **Full Changelog**: https://github.com/parkers0405/neoism/releases
  footer: >-
    ---
    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).

nightly:
  version_template: "{{ incminor .Version }}-nightly"
  tag_name: nightly
  publish_release: true
  keep_single_release: true

changelog:
  disable: true

checksum:
  name_template: checksums.txt

archives:
  - id: win-x64
    formats: [binary]
    ids: [windows-x86_64]
    name_template: "{{ .ProjectName }}-portable-x86_64"
  - id: win-arm64
    formats: [binary]
    ids: [windows-arm64]
    name_template: "{{ .ProjectName }}-portable-aarch64"

universal_binaries:
  - ids: [macos]
    replace: true

dmg:
  - name: "{{ .ProjectName }}"
    use: appbundle

notarize:
  macos_native:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      sign:
        identity: "Developer ID Application: TODO_APPLE_DEVELOPER_ID"
        keychain: "{{ .Env.KEYCHAIN_PATH }}"
        options: [runtime]
      notarize:
        wait: true
        profile_name: "{{ .Env.MACOS_NOTARY_KEYCHAIN_PROFILE }}"

app_bundles:
  - icon: ./misc/macos/neoism.icns
    bundle: dev.neoism.Neoism
    extra_files:
      # Not templated: the plist carries a literal {{VERSION}} placeholder
      # (the CI darwin packaging step seds it); goreleaser's Go templating
      # would choke on that syntax.
      - src: ./misc/macos/Info.plist
        dst: Contents/Info.plist
      - src: ./misc/macos/neoism.icns
        dst: Contents/Resources/neoism.icns

nfpms:
  - formats: [deb, rpm]
    id: deb-arm64-wayland
    ids: [linux-arm64-wayland]
    file_name_template: "{{- trimsuffix .ConventionalFileName .ConventionalExtension -}}_wayland"
    package_name: neoism
    dependencies: [libc6 (>= 2.35), libstdc++6 (>= 11)]
    overrides:
      rpm:
        dependencies: [glibc, libstdc++]
        contents:
          - src: ./misc/neoism.desktop
            dst: /usr/share/applications/neoism.desktop
          - src: ./neoism-frontend/desktop/assets/icons/neoism.png
            dst: /usr/share/icons/hicolor/512x512/apps/neoism.png
    contents:
      - src: ./misc/neoism.desktop
        dst: /usr/share/applications/neoism.desktop
      - src: ./neoism-frontend/desktop/assets/icons/neoism.png
        dst: /usr/share/icons/hicolor/512x512/apps/neoism.png
    section: admin
    priority: optional
  - formats: [deb, rpm]
    id: deb-arm64-x11
    ids: [linux-arm64-x11]
    file_name_template: "{{- trimsuffix .ConventionalFileName .ConventionalExtension -}}_x11"
    package_name: neoism
    dependencies: [libc6 (>= 2.35), libstdc++6 (>= 11)]
    overrides:
      rpm:
        dependencies: [glibc, libstdc++]
        contents:
          - src: ./misc/neoism.desktop
            dst: /usr/share/applications/neoism.desktop
          - src: ./neoism-frontend/desktop/assets/icons/neoism.png
            dst: /usr/share/icons/hicolor/512x512/apps/neoism.png
    contents:
      - src: ./misc/neoism.desktop
        dst: /usr/share/applications/neoism.desktop
      - src: ./neoism-frontend/desktop/assets/icons/neoism.png
        dst: /usr/share/icons/hicolor/512x512/apps/neoism.png
    section: admin
    priority: optional
  - formats: [deb, rpm]
    id: deb-x64-wayland
    ids: [linux-x64-wayland]
    file_name_template: "{{- trimsuffix .ConventionalFileName .ConventionalExtension -}}_wayland"
    package_name: neoism
    dependencies: [libc6 (>= 2.35), libstdc++6 (>= 11)]
    overrides:
      rpm:
        dependencies: [glibc, libstdc++]
        contents:
          - src: ./misc/neoism.desktop
            dst: /usr/share/applications/neoism.desktop
          - src: ./neoism-frontend/desktop/assets/icons/neoism.png
            dst: /usr/share/icons/hicolor/512x512/apps/neoism.png
    contents:
      - src: ./misc/neoism.desktop
        dst: /usr/share/applications/neoism.desktop
      - src: ./neoism-frontend/desktop/assets/icons/neoism.png
        dst: /usr/share/icons/hicolor/512x512/apps/neoism.png
    section: admin
    priority: optional
  - formats: [deb, rpm]
    id: deb-x64-x11
    ids: [linux-x64-x11]
    file_name_template: "{{- trimsuffix .ConventionalFileName .ConventionalExtension -}}_x11"
    package_name: neoism
    dependencies: [libc6 (>= 2.35), libstdc++6 (>= 11)]
    overrides:
      rpm:
        dependencies: [glibc, libstdc++]
        contents:
          - src: ./misc/neoism.desktop
            dst: /usr/share/applications/neoism.desktop
          - src: ./neoism-frontend/desktop/assets/icons/neoism.png
            dst: /usr/share/icons/hicolor/512x512/apps/neoism.png
    contents:
      - src: ./misc/neoism.desktop
        dst: /usr/share/applications/neoism.desktop
      - src: ./neoism-frontend/desktop/assets/icons/neoism.png
        dst: /usr/share/icons/hicolor/512x512/apps/neoism.png
    section: admin
    priority: optional

msi:
  - id: win-x64
    name: "{{ .ProjectName }}-installer-x86_64"
    wxs: ./misc/windows/neoism.wxs
    ids: [windows-x86_64]
    extensions: [WixToolset.UI.wixext, WixToolset.Util.wixext]
    extra_files: [./misc/windows/neoism.ico, ./misc/windows/License.rtf]
  - id: win-arm64
    name: "{{ .ProjectName }}-installer-aarch64"
    wxs: ./misc/windows/neoism.wxs
    ids: [windows-arm64]
    extensions: [WixToolset.UI.wixext, WixToolset.Util.wixext]
    extra_files: [./misc/windows/neoism.ico, ./misc/windows/License.rtf]

winget:
  - use: msi
    name: Neoism
    package_identifier: parkers0405.neoism
    author: Neoism contributors # TODO: winget publisher display name
    release_notes: "{{ .Changelog }}"
    release_notes_url: https://github.com/parkers0405/neoism/releases/tag/{{ .Tag }}
    publisher: Neoism # TODO: winget publisher name
    publisher_url: https://github.com/parkers0405/neoism
    publisher_support_url: https://github.com/parkers0405/neoism/issues
    license_url: https://raw.githubusercontent.com/parkers0405/neoism/main/LICENSE
    copyright: Copyright (c) {{ .Now.Format "2006" }} Neoism contributors
    copyright_url: https://raw.githubusercontent.com/parkers0405/neoism/main/LICENSE
    tags: [cross-platform, terminal, terminal-emulators]
    commit_msg_template: "New version: parkers0405.neoism {{ .Tag }}"
    commit_author:
      name: TODO_YOUR_GH_USERNAME # TODO: winget-pkgs PR author
      email: TODO_YOUR_NOREPLY_EMAIL
    repository:
      owner: parkers0405
      name: winget-pkgs
      branch: neoism-{{ .Tag }}-{{ .Now.Format "20060102150405"}}
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master
        draft: false

after:
  hooks:
    - cmd: brew bump-cask-pr rio --version {{ .Version }}
      if: "{{ and .IsRelease .IsMerging }}"
      env: ["HOMEBREW_GITHUB_API_TOKEN={{ .Env.GITHUB_TOKEN }}"]
      output: true
    - cmd: cargo publish -p rio-window
      if: "{{ and .IsRelease .IsMerging }}"
      output: true
    - cmd: cargo publish -p sugarloaf
      if: "{{ and .IsRelease .IsMerging }}"
      output: true
    - cmd: cargo publish -p rio-proc-macros
      if: "{{ and .IsRelease .IsMerging }}"
      output: true
    - cmd: cargo publish -p copa
      if: "{{ and .IsRelease .IsMerging }}"
      output: true
    - cmd: cargo publish -p corcovado
      if: "{{ and .IsRelease .IsMerging }}"
      output: true
    - cmd: cargo publish -p teletypewriter
      if: "{{ and .IsRelease .IsMerging }}"
      output: true
    - cmd: cargo publish -p rio-backend
      if: "{{ and .IsRelease .IsMerging }}"
      output: true
    - cmd: cargo publish -p rioterm
      if: "{{ and .IsRelease .IsMerging }}"
      output: true

metadata:
  maintainers: [Neoism contributors] # TODO: package maintainer name/email
  license: MIT
  description: A terminal-first workspace for code, notes, agents, and multiplayer editing.
  homepage: https://github.com/parkers0405/neoism
