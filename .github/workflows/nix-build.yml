name: Nix Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.nix'
      - 'flake.lock'
      - 'rust-toolchain.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      # Workspace members, including their embedded assets and build scripts.
      - 'neoism-*/**'
      - 'sugarloaf/**'
      - 'teletypewriter/**'
      - 'corcovado/**'
      - 'copa/**'
      - 'assets/omarchy/**'
      - 'docs/lua-api.lua'
      - 'README.md'
      - 'misc/**'
      - '.github/workflows/nix-build.yml'

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: DeterminateSystems/flake-checker-action@main
      - name: Evaluate all declared platforms
        run: nix flake check --all-systems --no-build --no-write-lock-file
      - name: Check runtime library loading
        run: nix flake check --no-write-lock-file --max-jobs 1 --cores 2 --print-build-logs
      - name: Build native package
        run: nix build .#neoism --no-write-lock-file --max-jobs 1 --cores 2 --print-build-logs
