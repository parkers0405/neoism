name: Build Neoism GPUIX (Linux)
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: gpuix-build-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  NEOISM_GPUIX_RUST_BUILDER: blaze
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libfontconfig1-dev libfreetype-dev libgbm-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev libwayland-dev libasound2-dev libvulkan-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.92'
      - uses: ./.github/actions/setup-blaze
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            neoism-frontend/gpuix/package-lock.json
            neoism-agent/sdk/typescript/package-lock.json
      - name: Build the application and services
        run: make build
      - name: Check frontend dependencies
        run: bash scripts/check-frontend-deps.sh
      - name: Check the frontend
        working-directory: neoism-frontend/gpuix
        run: |
          npm run typecheck
          npm run check:design
          npm test
          node_modules/.bin/bun scripts/verify-core.ts
      - name: Check Agent GUI assets and tests
        working-directory: neoism-agent/sdk/typescript/packages/gui
        run: |
          npm run assets:check
          npm run test:assets
          npm test
      - name: Check service and shared code
        run: node scripts/test-workspace.mjs --locked
      - name: Check native bridge
        run: CARGO_TARGET_DIR=target/gpuix-core-blaze bash scripts/blaze.sh test --locked --manifest-path neoism-frontend/gpuix/native/Cargo.toml --lib --release
      - name: Check installer transaction
        run: bash scripts/test-gpuix-install.sh
      - name: Package
        run: bash scripts/package-gpuix.sh
      - name: Verify installed release and daemon startup
        run: python3 scripts/test-gpuix-release.py --without-window
      - uses: actions/upload-artifact@v4
        with:
          name: neoism-linux-x86_64
          path: |
            release/neoism-linux-x86_64.tar.gz
            release/neoism-linux-x86_64.tar.gz.sha256
