name: Build Mac/Windows

# Iteration workflow for the two release legs that don't build yet —
# darwin-aarch64 and windows-x86_64. Mirrors the Release Neoism build steps
# without publishing, so fixes can be validated here cheaply (no Linux
# rebuild per attempt). Once green, keep release-neoism.yml's steps in sync.

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Which legs to build"
        type: choice
        default: all
        options: [all, windows, darwin]

env:
  CARGO_TERM_COLOR: always
  # Same runner-safe codegen as release-neoism.yml.
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_PROFILE_RELEASE_LTO: "thin"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

jobs:
  build:
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ inputs.only == 'windows' && fromJSON('[{"runner":"windows-latest","goos":"windows","goarch":"x86_64","target":"x86_64-pc-windows-msvc"}]') || inputs.only == 'darwin' && fromJSON('[{"runner":"macos-latest","goos":"darwin","goarch":"aarch64","target":"aarch64-apple-darwin"}]') || fromJSON('[{"runner":"macos-latest","goos":"darwin","goarch":"aarch64","target":"aarch64-apple-darwin"},{"runner":"windows-latest","goos":"windows","goarch":"x86_64","target":"x86_64-pc-windows-msvc"}]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build the stack (release)
        # Unset CI: `fff-search`'s build script demands Zig when CI is set.
        shell: bash
        run: |
          env -u CI cargo build --release --locked --target ${{ matrix.target }} \
           -p neoism -p neoism-workspace-daemon -p neoism-agent --features wgpu

      - name: Install WiX Toolset
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet tool install --global wix --version 4.0.6
          wix extension add --global WixToolset.UI.wixext/4.0.6

      - name: Build Neoism Windows MSI
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object { $_.name -eq "neoism" }).version
          $bin = (Resolve-Path "target/${{ matrix.target }}/release").Path
          wix build misc/windows/neoism.wxs `
            -arch x64 -ext WixToolset.UI.wixext `
            -d "Version=$version" -d "BinaryDir=$bin" `
            -o Neoism-x86_64.msi
          $hash = Get-FileHash Neoism-x86_64.msi -Algorithm SHA256
          "$($hash.Hash.ToLower())  Neoism-x86_64.msi" |
            Set-Content -NoNewline Neoism-x86_64.msi.sha256

      - name: Smoke-test Windows installer
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = (Resolve-Path "Neoism-x86_64.msi").Path
          $installDir = Join-Path $env:LOCALAPPDATA "Programs\Neoism"
          $install = Start-Process msiexec.exe -ArgumentList "/i `"$installer`" /qn /norestart" -Wait -PassThru
          if ($install.ExitCode -notin @(0, 3010, 1641)) { throw "install failed: $($install.ExitCode)" }
          foreach ($binary in @("neoism.exe", "neoism-workspace-daemon.exe", "neoism-agent.exe")) {
            if (-not (Test-Path (Join-Path $installDir $binary))) { throw "$binary was not installed" }
          }
          $uninstall = Start-Process msiexec.exe -ArgumentList "/x `"$installer`" /qn /norestart" -Wait -PassThru
          if ($uninstall.ExitCode -notin @(0, 3010, 1641)) { throw "uninstall failed: $($uninstall.ExitCode)" }

      - name: Audit macOS runtime dependencies
        if: matrix.goos == 'darwin'
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release"
          bash scripts/audit-macos-dylibs.sh \
            "$BIN/neoism" \
            "$BIN/neoism-workspace-daemon" \
            "$BIN/neoism-agent"

      # Runtime validation on the real OS: PTY-layer unit + ConPTY spawn
      # smoke tests, then boot the daemon and require its loopback
      # listener to come up. This is the gate Windows must pass before
      # the release matrix row gets re-enabled.
      - name: PTY smoke tests (real ConPTY)
        if: matrix.goos == 'windows'
        shell: bash
        run: |
          env -u CI cargo test --release --locked --target ${{ matrix.target }} \
            -p teletypewriter -p neoism-terminal-pty -- --include-ignored

      - name: Daemon boot smoke (loopback listener + token)
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $daemon = Start-Process -PassThru -NoNewWindow `
            -FilePath "target/${{ matrix.target }}/release/neoism-workspace-daemon.exe" `
            -ArgumentList "--ephemeral"
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 1
            if ($daemon.HasExited) { throw "daemon exited early with code $($daemon.ExitCode)" }
            $probe = New-Object Net.Sockets.TcpClient
            try {
              $probe.Connect("127.0.0.1", 7878)
              if ($probe.Connected) { $ok = $true; $probe.Close(); break }
            } catch {} finally { $probe.Dispose() }
          }
          Stop-Process -Id $daemon.Id -Force
          if (-not $ok) { throw "daemon never opened 127.0.0.1:7878" }
          Write-Host "daemon loopback listener OK"

      # Package + upload what release-neoism.yml would ship so a dispatch
      # run yields a downloadable production artifact, not just a compile
      # check: tar.gz on mac (same as releases), MSI on Windows.
      - name: Package neoism-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
        if: matrix.goos != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          OUT="neoism-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p "stage/$OUT"
          BIN="target/${{ matrix.target }}/release"
          cp "$BIN/neoism" "$BIN/neoism-workspace-daemon" "$BIN/neoism-agent" "stage/$OUT/"
          if [[ "${{ matrix.goos }}" == "darwin" ]]; then
            # Neoism.app: double-clickable + Finder "Open With" candidate for
            # code/markdown/json (CFBundleDocumentTypes in misc/macos/Info.plist).
            # Ships INSIDE the tarball alongside the raw binaries above — CLI
            # installs keep using those, the .app is dragged to /Applications.
            APP="stage/$OUT/Neoism.app"
            mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
            cp "$BIN/neoism" "$BIN/neoism-workspace-daemon" "$BIN/neoism-agent" "$APP/Contents/MacOS/"
            cp misc/macos/neoism.icns "$APP/Contents/Resources/neoism.icns"
            VERSION="${GITHUB_REF_NAME#v}"
            case "$VERSION" in
              [0-9]*.[0-9]*) ;; # tag push: vX.Y.Z
              *) VERSION="$(cargo pkgid -p neoism | sed 's/.*[@#]//')" ;; # dispatch/dry run
            esac
            sed "s/{{VERSION}}/$VERSION/g" misc/macos/Info.plist > "$APP/Contents/Info.plist"
            codesign --force --deep -s - "$APP" # ad-hoc; real signing needs an Apple Dev account
          fi
          tar -C stage -czf "$OUT.tar.gz" "$OUT"
          if command -v sha256sum >/dev/null; then sha256sum "$OUT.tar.gz" > "$OUT.tar.gz.sha256";
          else shasum -a 256 "$OUT.tar.gz" > "$OUT.tar.gz.sha256"; fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: neoism-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            neoism-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
            neoism-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz.sha256
            Neoism-x86_64.msi
            Neoism-x86_64.msi.sha256
