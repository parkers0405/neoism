[package]
name = "neoism-rune"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Neoism frontend built natively on Rune"

# Its own workspace: Rune pins Rust 1.99.1 and the services keep building unchanged.
[workspace]

[[bin]]
name = "neoism-rune"
path = "src/main.rs"

[features]
# Opt-in CPU/wall phase timings for native frame traces; not enabled in shipped builds.
frame-profile = ["rune/frame-profile"]

[dependencies]
wgpu = { version = "~30.0.1", default-features = false, features = ["std", "wgsl"] }
rune = { git = "https://github.com/anomalyco/rune", rev = "e970367bd7d2a51e2e7d58e2978ea32eac7780cb", features = ["native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "e970367bd7d2a51e2e7d58e2978ea32eac7780cb", features = ["markdown"] }
neoism-protocol = { path = "../../neoism-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.24", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
dirs = "6"
# Pure native Markdown dictionary helpers (no legacy UI dependency).
typos-dict = "0.13"
unicase = "2.9"
png = "0.17"
qrcode = { version = "0.14.1", default-features = false }
base64 = "0.22"
libloading = "0.8"
unicode-segmentation = "1"
unicode-width = "0.2"
similar = "2"
# Question previews drop Markdown to one plain line (the copy rune-kit already builds).
pulldown-cmark = { version = "0.13", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
# Servers and Systems: GPUiX's native server registry, Fast Server hosting (OpenTunnel) and
# Quick-SSH transport (`neoism-frontend/gpuix/native/src`), compiled in by path.
neoism-agent-service-api = { path = "../../neoism-agent/crates/neoism-agent-service-api", default-features = false }
axum = { version = "0.7", features = ["ws"] }
futures = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["connect", "rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
sha2 = "0.10"
subtle = "2.5"
opentunnel = "=0.5.1"
libc = "0.2"
url = "2"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
thiserror = "2"
# Shared documents and presence: the Yrs replica and presence plane every Neoism client uses
# (`neoism-frontend/shared/src/editor/crdt`), compiled in by path.
yrs = { version = "0.26", features = ["sync"] }
web-time = "1.1"
tracing = "0.1"
# Explicit native SVG closure. Cytoscape enables architecture layouts; ELK is omitted
# (larger closure / EPL notices); the standard dagre path remains available.
merman = { version = "=0.10.0", default-features = false, features = ["all-diagrams", "svg", "layout-cytoscape", "native-fonts", "system-fonts"] }
resvg = { version = "=0.47.0", default-features = false, features = ["text"] }
ttf-parser = { version = "=0.25.1", default-features = false, features = ["std"] }

[target.'cfg(target_os = "ios")'.dependencies]
block2 = "0.5.1"
objc2 = "0.5.3"
objc2-foundation = { version = "0.2.2", features = ["block2", "NSArray", "NSData", "NSError", "NSItemProvider", "NSProgress", "NSSet", "NSString", "NSThread"] }
objc2-photos-ui = { version = "0.2.2", features = ["PHPicker"] }
objc2-ui-kit = { version = "0.2.2", features = ["block2", "UIApplication", "UIImage", "UIScene", "UISceneDefinitions", "UIViewController", "UIWindow", "UIWindowScene"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"

[profile.release]
debug = 1

[profile.dev.package."*"]
opt-level = 2

[patch.crates-io]
# Wayland: an unchanged IME cursor rectangle is not committed every frame (see vendor/winit-compat/README.md).
winit = { path = "../../vendor/winit-compat/winit-0.30.13" }

[patch."https://github.com/anomalyco/rune"]
# Pinned upstream plus direct-touch arbitration fixes (see ../vendor/rune/NEOISM.md).
rune = { path = "../vendor/rune/crates/rune" }
rune-motion = { path = "../vendor/rune/crates/rune-motion" }
rune-staging = { path = "../vendor/rune/crates/rune-staging" }
rune-taffy = { path = "../vendor/rune/crates/rune-taffy" }
procwatch = { path = "../vendor/rune/crates/procwatch" }
