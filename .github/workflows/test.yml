name: Test
on:
  pull_request:
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'neoism-frontend/gpuix/**'
      - 'neoism-agent/sdk/typescript/**'
      - '.github/workflows/test.yml'
      - '.github/actions/setup-blaze/**'
      - 'scripts/*blaze*'
      - 'scripts/test-workspace*'
      - '.cargo/**'
      - 'vendor/blaze-compat/**'
      - 'Makefile'
      - 'install.sh'
      - 'LICENSE'
      - 'NOTICE'
      - '.github/workflows/build-stack.yml'
      - 'scripts/gpuix.sh'
      - 'scripts/package-gpuix.sh'
      - 'scripts/install-gpuix-bundle.sh'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.92'
      - uses: ./.github/actions/setup-blaze
      - name: Install native service dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config cmake libfontconfig1-dev libgbm-dev libxkbcommon-dev
      - run: bash scripts/blaze.sh check --locked --workspace --all-targets
      - name: Guard the frontend boundary
        run: bash scripts/check-frontend-deps.sh
  frontend:
    uses: ./.github/workflows/build-stack.yml
