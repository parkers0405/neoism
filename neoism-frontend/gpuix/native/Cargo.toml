[package]
name = "neoism-gpuix-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Separate frontend build; never changes the desktop's feature selection.
[workspace]

[workspace.metadata.blaze]
# SQLx's macro links native SQLite/ring archives, so it cannot execute as WASM.
native-proc-macros = ["sqlx-macros"]

[dependencies]
neoism-ui = { path = "../../shared" }
neoism-protocol = { path = "../../../neoism-protocol" }
neoism-terminal-core = { path = "../../../neoism-terminal-core" }
neoism-agent-service-api = { path = "../../../neoism-agent/crates/neoism-agent-service-api", default-features = false }
sugarloaf = { path = "../../../sugarloaf", default-features = false }
dirs = "6.0.0"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
neoism-window = { path = "../../../neoism-window" }
bitflags = "2"
libloading = "0.8"
regex = "1"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
unicode-segmentation = "1"


axum = { version = "0.7", features = ["ws"] }
futures = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["connect", "rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
sha2 = "0.10"
base64 = "0.22"
subtle = "2.5"
opentunnel = "=0.5.1"
libc = "0.2"
url = "2"

[profile.dev]
split-debuginfo = "unpacked"
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
