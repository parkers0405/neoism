[package]
name = "neoism-rune"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Neoism frontend built natively on Rune"

# Its own workspace: Rune pins Rust 1.99.1 and the services keep building unchanged.
[workspace]

[[bin]]
name = "neoism-rune"
path = "src/main.rs"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "e970367bd7d2a51e2e7d58e2978ea32eac7780cb" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "e970367bd7d2a51e2e7d58e2978ea32eac7780cb", features = ["markdown"] }
neoism-protocol = { path = "../../neoism-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.24", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
dirs = "6"
png = "0.17"
base64 = "0.22"
libloading = "0.8"
unicode-segmentation = "1"
unicode-width = "0.2"
# Question previews drop Markdown to one plain line (the copy rune-kit already builds).
pulldown-cmark = { version = "0.13", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
# Servers and Systems: GPUiX's native server registry, Fast Server hosting (OpenTunnel) and
# Quick-SSH transport (`neoism-frontend/gpuix/native/src`), compiled in by path.
neoism-agent-service-api = { path = "../../neoism-agent/crates/neoism-agent-service-api", default-features = false }
axum = { version = "0.7", features = ["ws"] }
futures = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["connect", "rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
sha2 = "0.10"
subtle = "2.5"
opentunnel = "=0.5.1"
libc = "0.2"
url = "2"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
debug = 1

[profile.dev.package."*"]
opt-level = 2
