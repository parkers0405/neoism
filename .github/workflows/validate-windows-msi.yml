name: Validate existing Windows MSI

# Diagnostic only: replay the complete native smoke. No build, tag, or publishing.
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Release run containing a package-bearing pre-MSI checkpoint
        required: true
        type: string
      source_run_attempt:
        description: Exact source attempt (diagnostics-only older checkpoints cannot recover MSIs)
        required: true
        type: string
        default: '1'
      version:
        description: Exact original binary version expected (without v; never relabel a binary)
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      # Use the dispatched ref's smoke, NOT the source artifact's scripts.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check dispatch identity
        shell: pwsh
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_ATTEMPT: ${{ inputs.source_run_attempt }}
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          if ($env:SOURCE_RUN_ID -notmatch '^\d+$' -or $env:SOURCE_ATTEMPT -notmatch '^\d+$' -or
              $env:EXPECTED_VERSION -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
            throw 'Invalid source run ID, attempt, or version'
          }
      - uses: actions/download-artifact@v4
        with:
          name: windows-pre-msi-${{ inputs.source_run_id }}-${{ inputs.source_run_attempt }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: candidate
      - name: Verify checkpoint and replay full install, upgrade, updater, GUI and uninstall smoke
        shell: pwsh
        timeout-minutes: 15
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_ATTEMPT: ${{ inputs.source_run_attempt }}
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          ./scripts/windows-msi-checkpoint.ps1 -Mode Validate -Directory candidate `
            -ExpectedVersion $env:EXPECTED_VERSION -SourceRun $env:SOURCE_RUN_ID -SourceAttempt $env:SOURCE_ATTEMPT
      - name: Retain full logs and original checkpoint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi-validation-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            windows-validation/
            candidate/
            scripts/windows-msi-checkpoint.ps1
            scripts/windows-msi-validation.ps1
            scripts/windows-installed-gui-smoke.ps1
            scripts/windows-validation-process.ps1
            scripts/windows-updater-native-validation.ps1
            neoism-frontend/desktop/src/windows_update.ps1
          if-no-files-found: error
          retention-days: 14
