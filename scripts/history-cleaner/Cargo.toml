[package]
name = "neoism-history-cleaner"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone maintenance utility, not part of the desktop build.
[workspace]

[dependencies]
anyhow = "1"
regex = "1.12"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }
turso = "=0.8.3"

[patch.crates-io]
turso_core = { path = "../../vendor/blaze-compat/turso_core-0.8.3" }