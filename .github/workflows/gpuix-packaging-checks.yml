name: GPUIX packaging portability checks
on:
  push:
    branches: [fix/gpuix-chat-performance]
    paths:
      - .github/workflows/gpuix-packaging-checks.yml
      - scripts/windows-updater-tests.ps1
      - scripts/check-native-toolchain.py
      - scripts/restore-cached-source-times.py
      - scripts/test_restore_cached_source_times.py
      - neoism-frontend/gpuix/native/Cargo.toml
      - neoism-frontend/gpuix/native/Cargo.lock
      - neoism-frontend/updater/src/windows_update.ps1
      - neoism-frontend/gpuix/tests/update-cli.test.ts
      - neoism-frontend/gpuix/tests/packaged-daemon.test.ts
      - neoism-frontend/gpuix/tests/sdk.test.ts
      - neoism-frontend/gpuix/tests/config.test.ts
      - neoism-frontend/gpuix/tests/pinned-download.test.ts
      - neoism-frontend/gpuix/tests/canonical-path.test.ts
      - neoism-frontend/gpuix/tests/support/canonical-path.ts
      - neoism-frontend/gpuix/scripts/download-pinned.ts
  workflow_dispatch:
    inputs:
      native_fixtures:
        description: Diagnose Windows fixtures with the previous compiled native bridge (never publishes)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    name: ${{ matrix.os }} packaging checks
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Preserve source bytes before checkout
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Windows updater policies and rollback in both PowerShell hosts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/windows-updater-tests.ps1
          & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./scripts/windows-updater-tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell updater policy tests failed' }
      - name: Check the native compiler and cached source freshness
        run: |
          python scripts/check-native-toolchain.py
          python scripts/test_restore_cached_source_times.py
      - name: Install SDK and frontend dependencies
        shell: bash
        run: |
          npm --prefix neoism-agent/sdk/typescript ci
          npm --prefix neoism-frontend/gpuix ci
      # Catch host filesystem/transport assumptions before an expensive native
      # build. The release still runs its full suite against the native bridge.
      - name: Check design bytes, updater paths, daemon packaging, and SDK transport
        working-directory: neoism-frontend/gpuix
        shell: bash
        run: |
          ./node_modules/bun/bin/bun.exe scripts/build-sdk.ts
          ./node_modules/bun/bin/bun.exe scripts/sync-design.ts --check
          ./node_modules/bun/bin/bun.exe test ./tests/update-cli.test.ts ./tests/packaged-daemon.test.ts ./tests/sdk.test.ts ./tests/config.test.ts ./tests/pinned-download.test.ts ./tests/canonical-path.test.ts
      - name: Restore previous Windows native bridge for fixture diagnosis
        if: inputs.native_fixtures && runner.os == 'Windows'
        uses: actions/cache/restore@v4
        with:
          path: |
            neoism-frontend/gpuix/artifacts/gpuix-rustup
            target/gpuix-native-vsync
            target/gpuix-core-cargo
          key: fixture-diagnosis-${{ github.run_id }}
          restore-keys: gpuix-native-windows-x86_64-
          fail-on-cache-miss: true
      - name: Diagnose Windows native fixtures without rebuilding services
        if: inputs.native_fixtures && runner.os == 'Windows'
        working-directory: neoism-frontend/gpuix
        shell: pwsh
        run: |
          $env:NEOISM_GPUIX_CORE = (Resolve-Path '../../target/gpuix-core-cargo/release/neoism_gpuix_core.dll').Path
          ./node_modules/bun/bin/bun.exe scripts/build-ghostty.ts
          if ($LASTEXITCODE -ne 0) { throw 'Ghostty fixture setup failed' }
          ./node_modules/bun/bin/bun.exe test tests/git-controller.test.ts tests/ssh-transport.test.ts tests/workspace-directory.test.ts
          if ($LASTEXITCODE -ne 0) { throw 'Windows native fixtures failed' }
