[package]
name = "neoism-fts-v1-fixture"
version = "0.0.0"
edition = "2021"
publish = false

# Deliberately isolated from the application workspace and its patches/lockfile.
[workspace]

[dependencies]
turso = { version = "=0.6.1", default-features = false, features = ["fts"] }
# Pin the storage engine too, rather than allowing a later 0.6.x format.
turso_core = { version = "=0.6.1", default-features = false }
turso_sdk_kit = { version = "=0.6.1", default-features = false }
turso_sync_sdk_kit = { version = "=0.6.1", default-features = false }
flate2 = "1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
