[package]
name = "neoism-agent-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
async-stream.workspace = true
axum = { workspace = true, features = ["ws"] }
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
clap.workspace = true
base64.workspace = true
futures-core.workspace = true
futures.workspace = true
git2.workspace = true
iana-time-zone = "0.1.65"
libc.workspace = true
neoism-agent-core.workspace = true
neoism-agent-service-api.workspace = true
neoism-agent-plugin-api.workspace = true
neoism-agent-builtins.workspace = true
notify = "8.2.0"
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
tokio.workspace = true
turso.workspace = true
tokio-stream.workspace = true
tower-http.workspace = true
tower.workspace = true
tracing.workspace = true
url.workspace = true
dirs = "6"
dunce.workspace = true
image_rs.workspace = true
enigo = { version = "0.6.1", default-features = false, features = ["wayland"] }

[target.'cfg(target_os = "linux")'.dependencies]
libwayshot = { version = "0.8.0", default-features = false }
wayland-client = "0.31"
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
xkbcommon = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
xcap = "0.9.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
