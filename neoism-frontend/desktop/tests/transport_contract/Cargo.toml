[package]
name = "neoism-server-transport-contract"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone test package: depending on the desktop package's integration target
# makes Cargo build the GUI binary too. This package compiles the same sources
# through #[path], without changing the desktop binary's feature requirements.
[workspace]

[profile.dev]
debug = 0
incremental = false

[features]
default = ["server-transport-contract"]
server-transport-contract = []

[[test]]
name = "server_transport_contract"
path = "../server_transport_contract.rs"

[[test]]
name = "live_ordinary_diagnostic"
path = "src/live_diagnostic.rs"

[dependencies]
neoism_desktop = { package = "neoism", path = "../..", default-features = false, features = ["x11"] }
base64 = "0.22"
libc = "0.2"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
tower-service = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
neoism-ui = { path = "../../../../neoism-frontend/shared" }
neoism-backend = { path = "../../../../neoism-backend" }
neoism-protocol = { path = "../../../../neoism-protocol" }
neoism-workspace-daemon = { path = "../../../../neoism-workspace-daemon" }
neoism-agent-server = { path = "../../../../neoism-agent/crates/neoism-agent-server" }
neoism-agent-neoism-adapter = { path = "../../../../neoism-agent/crates/neoism-agent-neoism-adapter" }
neoism-agent-service-api = { path = "../../../../neoism-agent/crates/neoism-agent-service-api" }
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures = "0.3.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
thiserror = "1"
sha2 = "0.10"
subtle = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tempfile = "3"
dirs = "6"
tower = { version = "0.5", features = ["util"] }
opentunnel = "=0.5.1"
