[package]
name = "neoism-gpuix-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Keep native bridge profiles independent of the workspace services.
[workspace]

[patch.crates-io]
# This independent workspace must use the same service/index compiler patches.
icu_collator_data = { path = "../../../vendor/blaze-compat/icu_collator_data-2.4.0" }
turso_core = { path = "../../../vendor/blaze-compat/turso_core-0.8.3" }

[workspace.metadata.blaze]
version = "0.20261029.5"
# SQLx's macro links native SQLite/ring archives, so it cannot execute as WASM.
native-proc-macros = ["sqlx-macros", "enum-as-inner"]

[dependencies]
neoism-ui = { path = "../../shared" }
neoism-protocol = { path = "../../../neoism-protocol" }
neoism-terminal-types = { path = "../../../neoism-terminal-types" }
neoism-agent-service-api = { path = "../../../neoism-agent/crates/neoism-agent-service-api", default-features = false }
neoism-paint = { path = "../../../neoism-paint" }
dirs = "6.0.0"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
bitflags = "2"
libloading = "0.8"
# The allocator also comes through the workspace index. This cdylib is loaded
# after Bun starts, so its TLS must use the allocator's dynamic loading mode.
mimalloc = { version = "0.1", features = ["local_dynamic_tls"] }
regex = "1"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
unicode-segmentation = "1"


axum = { version = "0.7", features = ["ws"] }
futures = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["connect", "rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
sha2 = "0.10"
base64 = "0.22"
subtle = "2.5"
opentunnel = "=0.5.1"
libc = "0.2"
url = "2"

[profile.dev]
split-debuginfo = "unpacked"
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
sysinfo = { version = "=0.40.1", default-features = false, features = ["system"] }
