name: Release Neoism

# Builds the full Neoism stack (desktop + daemon + agent) for Linux, macOS,
# and Windows, then uploads `neoism-<os>-<arch>.*` to the GitHub Release — the assets
# the `scripts/install.sh` one-liner downloads. Free (no GoReleaser Pro).
#
# Cut a release:  git tag v0.4.0 && git push origin v0.4.0
# Dry run:        Actions → Release Neoism → Run workflow
#
# NOTE: the older `release.yml` + `.goreleaser.yaml` are inherited from Rio
# (build `rioterm`, GoReleaser Pro). Disable that workflow so the two don't
# both fire on tags.
#
# macOS Developer ID signing + notarization activates automatically when
# these repo secrets exist (otherwise the app ships ad-hoc signed):
#   MACOS_SIGN_P12            base64 of the "Developer ID Application" .p12
#   MACOS_SIGN_P12_PASSWORD   the .p12 export password
#   APPLE_ID                  Apple ID email of the developer account
#   APPLE_TEAM_ID             10-char team id (developer.apple.com → Membership)
#   APPLE_APP_SPECIFIC_PASSWORD  from appleid.apple.com → App-Specific Passwords
# Windows Authenticode signing activates when these repo secrets exist:
#   WINDOWS_SIGN_PFX          base64 of the code-signing .pfx
#   WINDOWS_SIGN_PFX_PASSWORD the .pfx export password

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # The workspace release profile (debug=full, lto=true, codegen-units=1)
  # OOM-kills 16GB hosted runners while LTO-compiling the desktop crate
  # (see build-stack.yml). Local ./install.sh builds keep the full-fat
  # profile; published binaries trade a few % codegen for actually building.
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_PROFILE_RELEASE_LTO: "thin"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

jobs:
  # Never rebuild what's already green: if THIS exact commit already has a
  # successful run of this workflow (a dispatch validation run), a tag push
  # reuses its artifacts instead of rebuilding all three legs. Same commit
  # ⇒ same baked-in version string, so the binaries are byte-honest.
  # Release flow that exploits this: bump version → push → (optional)
  # dispatch validation → tag the SAME commit → instant publish.
  precheck:
    name: find reusable build
    runs-on: ubuntu-latest
    outputs:
      reuse_run: ${{ steps.find.outputs.run_id }}
    steps:
      - name: Find a successful same-commit run with artifacts
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=""
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            for id in $(gh api "repos/${{ github.repository }}/actions/workflows/release-neoism.yml/runs?head_sha=${{ github.sha }}&status=success&per_page=10" --jq '.workflow_runs[].id'); do
              count=$(gh api "repos/${{ github.repository }}/actions/runs/$id/artifacts" --jq '.artifacts | length')
              if [[ "$count" -ge 3 ]]; then run_id="$id"; break; fi
            done
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "reusable run: ${run_id:-none — building from scratch}"

  build:
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: precheck
    if: needs.precheck.outputs.reuse_run == ''
    runs-on: ${{ matrix.runner }}
    env:
      # Secrets aren't allowed in step-level `if:` directly; this job-level
      # indirection is the documented pattern.
      HAVE_MAC_SIGNING: ${{ secrets.MACOS_SIGN_P12 != '' }}
      HAVE_WINDOWS_SIGNING: ${{ secrets.WINDOWS_SIGN_PFX != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, goos: linux,  goarch: x86_64,  target: x86_64-unknown-linux-gnu }
          - { runner: macos-latest,  goos: darwin, goarch: aarch64, target: aarch64-apple-darwin }
          # darwin-x86_64 dropped: GitHub retired the macos-13 Intel runners,
          # so the job queues forever. Re-add via cross-compile from arm64
          # (aarch64 mac runner + x86_64-apple-darwin target) if Intel macs
          # ever matter.
          # - { runner: macos-13,      goos: darwin, goarch: x86_64,  target: x86_64-apple-darwin }
          # Windows ships as a per-user WiX MSI. The installer owns the three
          # binaries, PATH, shortcuts, associations, upgrades, and uninstall.
          - { runner: windows-latest, goos: windows, goarch: x86_64,  target: x86_64-pc-windows-msvc }
          # linux-aarch64 dropped for now: `ubuntu-24.04-arm` isn't free on a
          # private repo. Re-add via cross-compile or a paid/public runner.
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config cmake \
            libwayland-dev libxkbcommon-dev libxcb1-dev \
            libfontconfig1-dev libfreetype6-dev \
            glslang-tools libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build the stack (release)
        # Unset CI: `fff-search`'s build script demands Zig when CI is set,
        # but it builds fine natively (exactly like the local build).
        shell: bash
        run: |
          env -u CI cargo build --release --locked --target ${{ matrix.target }} \
           -p neoism -p neoism-workspace-daemon -p neoism-agent --features wgpu

      - name: Install WiX Toolset
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet tool install --global wix --version 4.0.6
          wix extension add --global WixToolset.UI.wixext/4.0.6

      - name: Sign Windows executables (Authenticode)
        if: matrix.goos == 'windows' && env.HAVE_WINDOWS_SIGNING == 'true'
        shell: pwsh
        env:
          WINDOWS_SIGN_PFX: ${{ secrets.WINDOWS_SIGN_PFX }}
          WINDOWS_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $pfx = Join-Path $env:RUNNER_TEMP "neoism-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_SIGN_PFX))
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1).FullName
          if (-not $signtool) { throw "signtool.exe was not found" }
          $bin = "target/${{ matrix.target }}/release"
          foreach ($file in @("$bin/neoism.exe", "$bin/neoism-workspace-daemon.exe", "$bin/neoism-agent.exe")) {
            & $signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com `
              /f $pfx /p $env:WINDOWS_SIGN_PFX_PASSWORD $file
            if ($LASTEXITCODE -ne 0) { throw "failed to sign $file" }
            if ((Get-AuthenticodeSignature $file).Status -ne "Valid") { throw "invalid signature: $file" }
          }

      - name: Build Neoism Windows MSI
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object { $_.name -eq "neoism" }).version
          $bin = (Resolve-Path "target/${{ matrix.target }}/release").Path
          $fixtureBin = Join-Path $env:RUNNER_TEMP "neoism-upgrade-fixture"
          New-Item -ItemType Directory -Force $fixtureBin | Out-Null
          Copy-Item "$bin\neoism.exe", "$bin\neoism-workspace-daemon.exe", "$bin\neoism-agent.exe" $fixtureBin
          [IO.File]::AppendAllText((Join-Path $fixtureBin "neoism.exe"), "neoism-upgrade-fixture")
          wix build misc/windows/neoism.wxs `
            -arch x64 `
            -ext WixToolset.UI.wixext `
            -d "Version=0.0.1" `
            -d "BinaryDir=$fixtureBin" `
            -o Neoism-upgrade-fixture.msi
          wix build misc/windows/neoism.wxs `
            -arch x64 `
            -ext WixToolset.UI.wixext `
            -d "Version=$version" `
            -d "BinaryDir=$bin" `
            -o Neoism-x86_64.msi

      - name: Sign and hash Windows MSI
        if: matrix.goos == 'windows'
        shell: pwsh
        env:
          WINDOWS_SIGN_PFX: ${{ secrets.WINDOWS_SIGN_PFX }}
          WINDOWS_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGN_PFX)) {
            $pfx = Join-Path $env:RUNNER_TEMP "neoism-signing.pfx"
            $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName -Descending | Select-Object -First 1).FullName
            & $signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com `
              /f $pfx /p $env:WINDOWS_SIGN_PFX_PASSWORD Neoism-x86_64.msi
            if ($LASTEXITCODE -ne 0) { throw "failed to sign Neoism-x86_64.msi" }
            if ((Get-AuthenticodeSignature Neoism-x86_64.msi).Status -ne "Valid") {
              throw "the MSI Authenticode signature is invalid"
            }
          }
          $hash = Get-FileHash Neoism-x86_64.msi -Algorithm SHA256
          "$($hash.Hash.ToLower())  Neoism-x86_64.msi" |
            Set-Content -NoNewline Neoism-x86_64.msi.sha256

      - name: Parse installer bootstrap with Windows PowerShell 5.1
        if: matrix.goos == 'windows'
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "install.ps1"), [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) { $errors | Format-List; throw "install.ps1 has parse errors" }

      - name: Smoke-test Windows install, upgrade, and uninstall
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Invoke-Msi([string]$arguments) {
            $process = Start-Process msiexec.exe -ArgumentList $arguments -Wait -PassThru
            if ($process.ExitCode -notin @(0, 3010, 1641)) {
              throw "msiexec failed with code $($process.ExitCode): $arguments"
            }
          }
          $fixture = (Resolve-Path "Neoism-upgrade-fixture.msi").Path
          $installer = (Resolve-Path "Neoism-x86_64.msi").Path
          $installDir = Join-Path $env:LOCALAPPDATA "Programs\Neoism"
          $userData = Join-Path $env:LOCALAPPDATA "neoism\installer-preserve-test"
          New-Item -ItemType Directory -Force (Split-Path $userData) | Out-Null
          Set-Content $userData "preserve"

          Invoke-Msi "/i `"$fixture`" /qn /norestart"
          $fixtureHash = (Get-FileHash (Join-Path $installDir "neoism.exe") -Algorithm SHA256).Hash
          Invoke-Msi "/i `"$installer`" /qn /norestart"

          foreach ($binary in @("neoism.exe", "neoism-workspace-daemon.exe", "neoism-agent.exe")) {
            if (-not (Test-Path (Join-Path $installDir $binary))) { throw "$binary was not installed" }
          }
          $version = (& (Join-Path $installDir "neoism.exe") --version | Out-String).Trim()
          if ($version -notmatch "neoism") { throw "installed executable did not report its version" }
          $appPath = (Get-Item "HKCU:\Software\Microsoft\Windows\CurrentVersion\App Paths\neoism.exe").GetValue('')
          if ($appPath -ne (Join-Path $installDir "neoism.exe")) { throw "App Paths registration is wrong" }
          $registeredVersion = (Get-ItemProperty "HKCU:\Software\Neoism").InstalledVersion
          $expectedVersion = ((cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object { $_.name -eq "neoism" }).version
          if ($registeredVersion -ne $expectedVersion) { throw "MSI major upgrade did not replace the fixture" }
          $installedHash = (Get-FileHash (Join-Path $installDir "neoism.exe") -Algorithm SHA256).Hash
          if ($installedHash -eq $fixtureHash) { throw "MSI major upgrade did not replace neoism.exe" }
          $shortcut = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Neoism\Neoism.lnk"
          if (-not (Test-Path $shortcut)) { throw "Start Menu shortcut was not installed" }
          $userPath = [Environment]::GetEnvironmentVariable("Path", "User")
          if (($userPath -split ';').TrimEnd('\') -notcontains $installDir.TrimEnd('\')) {
            throw "Neoism install directory was not added to the user PATH"
          }

          Invoke-Msi "/x `"$installer`" /qn /norestart"
          if (Test-Path (Join-Path $installDir "neoism.exe")) { throw "Neoism remained after uninstall" }
          if (Test-Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\App Paths\neoism.exe") { throw "App Paths registration remained after uninstall" }
          if (Test-Path $shortcut) { throw "Start Menu shortcut remained after uninstall" }
          if (Test-Path "HKCU:\Software\Classes\Directory\Background\shell\Open Neoism here") { throw "context menu remained after uninstall" }
          if (Test-Path "HKCU:\Software\Neoism\Capabilities") { throw "Default Apps capabilities remained after uninstall" }
          $registeredApp = Get-ItemProperty "HKCU:\Software\RegisteredApplications" -Name "Neoism" -ErrorAction SilentlyContinue
          if ($null -ne $registeredApp) { throw "RegisteredApplications entry remained after uninstall" }
          $userPathAfter = [Environment]::GetEnvironmentVariable("Path", "User")
          if (($userPathAfter -split ';').TrimEnd('\') -contains $installDir.TrimEnd('\')) {
            throw "Neoism install directory remained on the user PATH after uninstall"
          }
          if (-not (Test-Path $userData)) { throw "uninstall removed Neoism user data" }
          Remove-Item $userData -Force

      - name: Audit macOS runtime dependencies
        if: matrix.goos == 'darwin'
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release"
          bash scripts/audit-macos-dylibs.sh \
            "$BIN/neoism" \
            "$BIN/neoism-workspace-daemon" \
            "$BIN/neoism-agent"

      - name: Package neoism-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
        if: matrix.goos != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          OUT="neoism-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p "stage/$OUT"
          BIN="target/${{ matrix.target }}/release"
          cp "$BIN/neoism" "$BIN/neoism-workspace-daemon" "$BIN/neoism-agent" "stage/$OUT/"
          if [[ "${{ matrix.goos }}" == "darwin" ]]; then
            # Neoism.app: double-clickable + Finder "Open With" candidate for
            # code/markdown/json (CFBundleDocumentTypes in misc/macos/Info.plist).
            # Ships INSIDE the tarball alongside the raw binaries above — CLI
            # installs keep using those, the .app is dragged to /Applications.
            APP="stage/$OUT/Neoism.app"
            mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
            cp "$BIN/neoism" "$BIN/neoism-workspace-daemon" "$BIN/neoism-agent" "$APP/Contents/MacOS/"
            cp misc/macos/neoism.icns "$APP/Contents/Resources/neoism.icns"
            VERSION="${GITHUB_REF_NAME#v}"
            case "$VERSION" in
              [0-9]*.[0-9]*) ;; # tag push: vX.Y.Z
              *) VERSION="$(cargo pkgid -p neoism | sed 's/.*[@#]//')" ;; # dispatch/dry run
            esac
            sed "s/{{VERSION}}/$VERSION/g" misc/macos/Info.plist > "$APP/Contents/Info.plist"
            codesign --force --deep -s - "$APP" # ad-hoc; real signing needs an Apple Dev account
          fi
          tar -C stage -czf "$OUT.tar.gz" "$OUT"
          if command -v sha256sum >/dev/null; then sha256sum "$OUT.tar.gz" > "$OUT.tar.gz.sha256";
          else shasum -a 256 "$OUT.tar.gz" > "$OUT.tar.gz.sha256"; fi

      # Developer ID signing + notarization. Signs the CLI binaries and the
      # .app inside-out with hardened runtime, notarizes, staples, and
      # re-tars the tarball so it carries the stapled app. Skipped (ad-hoc
      # signature ships) until the MACOS_SIGN_* / APPLE_* secrets exist.
      - name: Sign and notarize Neoism.app (Developer ID)
        if: matrix.goos == 'darwin' && env.HAVE_MAC_SIGNING == 'true'
        shell: bash
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          OUT="neoism-${{ matrix.goos }}-${{ matrix.goarch }}"
          APP="stage/$OUT/Neoism.app"

          # Import the Developer ID certificate into a throwaway keychain.
          KEYCHAIN="$RUNNER_TEMP/sign.keychain-db"
          KEYCHAIN_PASS="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          printf '%s' "$MACOS_SIGN_P12" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          security import "$RUNNER_TEMP/sign.p12" -k "$KEYCHAIN" \
            -P "$MACOS_SIGN_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASS" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk -F'"' '/Developer ID Application/{print $2; exit}')
          [ -n "$IDENTITY" ] || { echo "::error::p12 has no Developer ID Application identity"; exit 1; }
          echo "signing as: $IDENTITY"

          # Inside-out: nested executables first, then the bundle, then the
          # loose CLI copies at the tarball root. Hardened runtime is a
          # notarization requirement.
          for bin in "$APP/Contents/MacOS/"*; do
            codesign --force --options runtime --timestamp --sign "$IDENTITY" "$bin"
          done
          codesign --force --options runtime --timestamp --sign "$IDENTITY" "$APP"
          for bin in neoism neoism-workspace-daemon neoism-agent; do
            codesign --force --options runtime --timestamp --sign "$IDENTITY" "stage/$OUT/$bin"
          done
          codesign --verify --strict --verbose=2 "$APP"

          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/Neoism.app.zip"
          xcrun notarytool submit "$RUNNER_TEMP/Neoism.app.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait
          xcrun stapler staple "$APP"

          # The tarball from the packaging step contains the ad-hoc app;
          # rebuild it around the signed, stapled one.
          tar -C stage -czf "$OUT.tar.gz" "$OUT"
          shasum -a 256 "$OUT.tar.gz" > "$OUT.tar.gz.sha256"

      # Drag-to-install DMG: the same Neoism.app plus an /Applications
      # symlink, compressed with hdiutil (no third-party tooling). When
      # signing secrets exist the DMG is itself signed, notarized, and
      # stapled; otherwise it ships ad-hoc (right-click → Open once).
      - name: Package neoism-${{ matrix.goos }}-${{ matrix.goarch }}.dmg
        if: matrix.goos == 'darwin'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          OUT="neoism-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p stage/dmg
          cp -R "stage/$OUT/Neoism.app" stage/dmg/
          ln -s /Applications stage/dmg/Applications
          hdiutil create -volname "Neoism" -srcfolder stage/dmg -ov -format UDZO "$OUT.dmg"
          if [ "$HAVE_MAC_SIGNING" = "true" ]; then
            IDENTITY=$(security find-identity -v -p codesigning \
              | awk -F'"' '/Developer ID Application/{print $2; exit}')
            codesign --force --timestamp --sign "$IDENTITY" "$OUT.dmg"
            xcrun notarytool submit "$OUT.dmg" \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait
            xcrun stapler staple "$OUT.dmg"
          fi
          # Hash LAST — stapling rewrites the dmg.
          shasum -a 256 "$OUT.dmg" > "$OUT.dmg.sha256"

      # Publishes the built binaries to this repo's GitHub Releases, where the
      # curl|bash installer and `neoism update` fetch them. Uses the built-in
      # GITHUB_TOKEN (contents:write on the current repo) — no PAT needed.
      # Legs finish at very different speeds (warm macOS caches beat the
      # Linux leg by 20+ minutes). Publishing per-leg opened a window where
      # `neoism update` saw the new tag but 404'd on its platform tarball —
      # so every leg uploads to a DRAFT, and the `publish` job below flips
      # it public only after ALL legs have attached their assets.
      - name: Publish Unix artifacts to public dist repo
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') && matrix.goos != 'windows'
        with:
          repository: parkers0405/neoism
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          files: |
            neoism-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
            neoism-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz.sha256
          fail_on_unmatched_files: true

      - name: Publish macOS DMG to public dist repo
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') && matrix.goos == 'darwin'
        with:
          repository: parkers0405/neoism
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          files: |
            neoism-${{ matrix.goos }}-${{ matrix.goarch }}.dmg
            neoism-${{ matrix.goos }}-${{ matrix.goarch }}.dmg.sha256
          fail_on_unmatched_files: true

      - name: Publish Windows artifacts to public dist repo
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') && matrix.goos == 'windows'
        with:
          repository: parkers0405/neoism
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          files: |
            Neoism-x86_64.msi
            Neoism-x86_64.msi.sha256
          fail_on_unmatched_files: true

      - name: Upload Unix build artifact (dry runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') && matrix.goos != 'windows' }}
        uses: actions/upload-artifact@v4
        with:
          name: neoism-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            neoism-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
            neoism-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz.sha256
            neoism-${{ matrix.goos }}-${{ matrix.goarch }}.dmg*

      - name: Upload Windows build artifact (dry runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') && matrix.goos == 'windows' }}
        uses: actions/upload-artifact@v4
        with:
          name: neoism-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            Neoism-x86_64.msi
            Neoism-x86_64.msi.sha256

  # Flip the dist release public only once EVERY leg has uploaded its
  # assets — closes the per-leg publish race where `neoism update` saw
  # the new tag before its platform tarball existed (v0.4.5 404s).
  # If any leg fails, the draft stays hidden and updaters keep serving
  # the previous release.
  publish:
    name: publish dist release
    needs: [precheck, build]
    if: >-
      always() && startsWith(github.ref, 'refs/tags/') &&
      (needs.build.result == 'success' ||
       (needs.build.result == 'skipped' && needs.precheck.outputs.reuse_run != ''))
    runs-on: ubuntu-latest
    steps:
      # Reuse path: the build matrix never ran, so attach the validated
      # same-commit run's artifacts to a fresh draft ourselves.
      - name: Attach reused artifacts to the draft release
        if: needs.build.result == 'skipped'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh run download "${{ needs.precheck.outputs.reuse_run }}" -R "${{ github.repository }}" -D artifacts
          gh release create "${{ github.ref_name }}" -R parkers0405/neoism \
            --draft --title "${{ github.ref_name }}" || true
          gh release upload "${{ github.ref_name }}" -R parkers0405/neoism --clobber artifacts/*/*
      - name: Undraft the dist release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" -R parkers0405/neoism --draft=false --latest
