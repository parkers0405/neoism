[package]
name = "neochat-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Standalone native Rune board and task inspector"

[workspace]

[features]
default = ["native-picker"]
native-picker = ["rune/native-file-dialog"]

[dependencies]
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
neochat = { path = ".." }
rune = { git = "https://github.com/anomalyco/rune", rev = "e970367bd7d2a51e2e7d58e2978ea32eac7780cb" }

[patch.crates-io]
winit = { path = "../../vendor/winit-compat/winit-0.30.13" }

[patch."https://github.com/anomalyco/rune"]
rune = { path = "../../rune/vendor/rune/crates/rune" }
rune-motion = { path = "../../rune/vendor/rune/crates/rune-motion" }
rune-staging = { path = "../../rune/vendor/rune/crates/rune-staging" }
rune-taffy = { path = "../../rune/vendor/rune/crates/rune-taffy" }
procwatch = { path = "../../rune/vendor/rune/crates/procwatch" }