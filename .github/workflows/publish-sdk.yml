name: Publish SDK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (defaults to the workspace Cargo version)"
        required: false
      dry-run:
        description: "Build and pack without publishing"
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish @neoism packages
        working-directory: neoism-agent/sdk/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: >
          node scripts/publish.mjs
          ${{ inputs.version && format('--version {0}', inputs.version) || '' }}
          ${{ inputs.dry-run && '--dry-run' || '' }}
